name: 🐛 Bug Report
description: Reportar um comportamento incorreto ou inesperado
labels: ['type: fix', 'status: ready']
body:
    - type: markdown
      attributes:
          value: |
              Obrigado por reportar! Preencha todas as seções para facilitar a reprodução.

    - type: textarea
      id: description
      attributes:
          label: Descrição do bug
          description: Descreva de forma clara o que está acontecendo.
      validations:
          required: true

    - type: textarea
      id: steps
      attributes:
          label: Passos para reproduzir
          placeholder: |
              1. Acessar `/preview`
              2. Clicar em `...`
              3. Observar erro `...`
      validations:
          required: true

    - type: textarea
      id: expected
      attributes:
          label: Comportamento esperado
      validations:
          required: true

    - type: textarea
      id: actual
      attributes:
          label: Comportamento atual
      validations:
          required: true

    - type: textarea
      id: context
      attributes:
          label: Contexto adicional
          description: Logs, stack traces, screenshots ou qualquer informação relevante.

    - type: dropdown
      id: priority
      attributes:
          label: Prioridade
          options:
              - 'priority: critical'
              - 'priority: high'
              - 'priority: medium'
              - 'priority: low'
      validations:
          required: true

    - type: dropdown
      id: area
      attributes:
          label: Área afetada
          options:
              - 'area: auth'
              - 'area: preview'
              - 'area: firestore'
              - 'area: cloudinary'
              - 'area: seo'
              - 'area: infra'
              - 'area: ui'
      validations:
          required: true
