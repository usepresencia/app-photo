name: CD

on:
    workflow_run:
        workflows: ['CI']
        branches: [main]
        types:
            - completed

jobs:
    deploy:
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        runs-on: ubuntu-latest
        name: Deploy to VPS

        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.workflow_run.head_sha }}

            - name: Setup Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and Push Docker Image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ./Dockerfile
                  push: true
                  # URL do admin-photo não é segredo (é a origem que o
                  # PreviewOverlay confia, exposta ao client de qualquer
                  # forma) — usa Variables do repositório, não Secrets.
                  build-args: |
                      NEXT_PUBLIC_ADMIN_PHOTO_URL=${{ vars.NEXT_PUBLIC_ADMIN_PHOTO_URL }}
                  tags: |
                      ghcr.io/${{ github.repository }}:latest
                      ghcr.io/${{ github.repository }}:${{ github.event.workflow_run.head_sha }}

            - name: Deploy on VPS
              uses: appleboy/ssh-action@v1.2.0
              with:
                  host: ${{ secrets.VPS_HOST }}
                  username: ${{ secrets.VPS_USER }}
                  key: ${{ secrets.VPS_SSH_KEY }}
                  script: |
                      set -e

                      cd /srv/app-fotografia/

                      NEW_TAG="${{ github.event.workflow_run.head_sha }}"
                      SERVICE="app-photo"
                      ENV_FILE=".env.app-photo"

                      echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

                      cp "$ENV_FILE" "${ENV_FILE}.bak"
                      sed -i "s/^APP_PHOTO_TAG=.*/APP_PHOTO_TAG=$NEW_TAG/" "$ENV_FILE"

                      set -a; source "$ENV_FILE"; set +a

                      docker compose pull "$SERVICE"
                      docker compose up -d --force-recreate "$SERVICE"

                      echo "Aguardando aplicação subir..."
                      sleep 15

                      if curl -fk "https://$APP_PHOTO_DOMAIN/api/health"; then
                        echo "Deploy validado com sucesso."
                        rm -f "${ENV_FILE}.bak"
                      else
                        echo "Falha no healthcheck. Iniciando rollback..."
                        mv "${ENV_FILE}.bak" "$ENV_FILE"
                        set -a; source "$ENV_FILE"; set +a
                        docker compose pull "$SERVICE"
                        docker compose up -d --force-recreate "$SERVICE"
                        exit 1
                      fi
