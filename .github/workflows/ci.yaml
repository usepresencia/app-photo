name: CI

on:
    push:
        branches: ['main']
    pull_request:
        branches: ['main']

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        name: Build and Test

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install Dependencies
              run: npm ci

            - name: Fetch PR commits (base + head)
              if: github.event_name == 'pull_request'
              run: |
                  git fetch --no-tags --prune origin "${{ github.event.pull_request.base.ref }}"
                  git fetch --no-tags --prune origin "pull/${{ github.event.pull_request.number }}/head:pr"

            - name: Validate Commit Messages
              if: github.event_name == 'pull_request'
              run: npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to pr --verbose

            - name: Check Code Formatting
              run: npx prettier '**/*.{css,ts,tsx,json,md}' --check

            - name: Type Check
              run: npm run typecheck

            - name: Run Tests
              run: npm run test

            - name: Build Next.js
              run: npm run build

    release:
        runs-on: ubuntu-latest
        name: Release
        needs: build-and-test
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install Dependencies
              run: npm ci

            - name: Configure Git
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

            - name: Release
              run: |
                  npm run release
                  git push --follow-tags origin main
